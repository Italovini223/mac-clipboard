name: ClipboardManager

options:
  bundleIdPrefix: com.weethub
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  defaultConfig: Debug

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

configs:
  Debug: debug
  Release: release

targets:
  ClipboardManager:
    type: application
    platform: macOS
    sources:
      - path: ClipboardManager
        excludes:
          - Resources/Info.plist
          - Resources/ClipboardManager.entitlements
          - Resources/com.weethub.ClipboardManager.plist
    resources:
      - ClipboardManager/Resources/Assets.xcassets
      - path: ClipboardManager/Resources/com.weethub.ClipboardManager.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weethub.ClipboardManager
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: ClipboardManager/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClipboardManager/Resources/ClipboardManager.entitlements
        PRODUCT_NAME: "Clipboard Manager"
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: "-DDEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: GRDB
        product: GRDB

schemes:
  ClipboardManager:
    build:
      targets:
        ClipboardManager: all
    run:
      config: Debug
      launchAutomaticallySubstyle: 2
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      archiveName: ClipboardManager
