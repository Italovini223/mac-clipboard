name: Build & Release

# Dispara quando um tag v* é criado (ex: v1.0.0)
on:
  push:
    tags:
      - "v*"

# Permissão para criar GitHub Releases e fazer upload de arquivos
permissions:
  contents: write

jobs:
  build:
    name: Build Universal Binary
    runs-on: macos-15          # Apple Silicon — o passo 2 seleciona o Xcode 26 (alternativa: macos-26)

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Seleciona o Xcode 26 e valida o SDK ──────────────────────────────
      # O visual Liquid Glass (.glassEffect) só compila com o SDK do macOS 26. Sem ele o build
      # ainda passaria (o código tem fallback), mas publicaria um app sem glass: falha antes.
      - name: Select Xcode 26
        run: |
          echo "Xcodes instalados:"
          ls -d /Applications/Xcode*.app

          # Maior versão instalada (sort -V), com o caminho do app
          best=$(for app in /Applications/Xcode*.app; do
            v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist" 2>/dev/null || echo 0)
            echo "$v $app"
          done | sort -V | tail -n 1)
          version="${best%% *}"
          app="${best#* }"
          echo "Maior Xcode encontrado: $version em $app"

          if [ "${version%%.*}" -lt 26 ]; then
            echo "::error::Nenhum Xcode >= 26 neste runner (maior: $version). O visual glass precisa do SDK 26. Troque runs-on para macos-26 ou instale o Xcode 26."
            exit 1
          fi

          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
          sdk=$(xcrun --show-sdk-version)
          echo "SDK macOS: $sdk"

          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::SDK macOS $sdk < 26: o build publicaria um app sem Liquid Glass."
            exit 1
          fi

      # ── 3. Instala XcodeGen ─────────────────────────────────────────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      # ── 4. Gera o .xcodeproj ────────────────────────────────────────────────
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # ── 5. Resolve dependências SPM (GRDB) ──────────────────────────────────
      - name: Resolve SPM packages
        run: |
          xcodebuild \
            -scheme ClipboardManager \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath .spm-cache

      # ── 6. Build universal (arm64 + x86_64) ─────────────────────────────────
      - name: Build
        run: |
          xcodebuild \
            -scheme ClipboardManager \
            -configuration Release \
            -clonedSourcePackagesDirPath .spm-cache \
            -derivedDataPath DerivedData \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      # ── 7. Assina ad-hoc (permite rodar sem Developer ID) ───────────────────
      - name: Ad-hoc sign
        run: |
          APP="DerivedData/Build/Products/Release/Clipboard Manager.app"
          codesign --force --deep --sign "-" "$APP"

      # ── 8. Empacota em ZIP ──────────────────────────────────────────────────
      - name: Package ZIP
        run: |
          cd "DerivedData/Build/Products/Release"
          zip -r "$GITHUB_WORKSPACE/ClipboardManager-${{ github.ref_name }}-universal.zip" \
            "Clipboard Manager.app"
          echo "ZIP criado:"
          ls -lh "$GITHUB_WORKSPACE/ClipboardManager-${{ github.ref_name }}-universal.zip"

      # ── 9. Cria GitHub Release e faz upload do ZIP ──────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Clipboard Manager ${{ github.ref_name }}"
          files: ClipboardManager-${{ github.ref_name }}-universal.zip
          body: |
            ## Instalação rápida

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            Ou baixe o ZIP abaixo e mova `Clipboard Manager.app` para `/Applications`.

            ---

            ### Requisitos
            - macOS 14 (Sonoma) ou superior
            - Permissão de Acessibilidade (solicitada no primeiro uso, necessária para o auto-paste)

            ### Nota de segurança
            Este app não é notarizado pela Apple (sem Developer ID).
            O script de instalação remove o atributo de quarentena automaticamente.
            Para mais detalhes, veja o README.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
